<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockSense — Add Product</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="stylesheet" href="css/dashboard.css?v=2">
</head>
<body>
    <nav class="navbar">
        <h2>StockSense</h2>
        <div>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="products.html" class="nav-link">Products</a>
            <a href="stock-actions.html" class="nav-link">Stock Actions</a>
            <a href="locations.html" class="nav-link">Warehouses & Categories</a>
            <a href="movements.html" class="nav-link">Movement History</a>
            <a href="alerts.html" class="nav-link">Alert Center</a>
            <a href="vendors.html" class="nav-link">Vendors</a>
            <a href="purchase-orders.html" class="nav-link">Purchase Orders</a>
            <a href="vendors.html" class="nav-link">Vendors</a>
            <a href="purchase-orders.html" class="nav-link">Purchase Orders</a>
            <a href="users.html" class="nav-link">Users</a>
            <button id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="dashboard">
        <h1>Add Product</h1>

        <section class="form-section">
            <form id="product-form">
                <label for="sku">SKU</label>
                <input type="text" id="sku" required>

                <label for="name">Name</label>
                <input type="text" id="name" required>

                <label for="description">Description</label>
                <textarea id="description" rows="3"></textarea>

                <label for="category">Category ID</label>
                <input type="number" id="category">

                <label for="unit_of_measure">Unit of Measure</label>
                <select id="unit_of_measure">
                    <option value="piece">Piece</option>
                    <option value="kg">Kilogram</option>
                    <option value="liter">Liter</option>
                    <option value="box">Box</option>
                    <option value="pack">Pack</option>
                    <option value="carton">Carton</option>
                </select>

                <label for="cost_price">Cost Price</label>
                <input type="number" step="0.01" id="cost_price" required>

                <label for="selling_price">Selling Price</label>
                <input type="number" step="0.01" id="selling_price" required>

                <label for="reorder_level">Reorder Level</label>
                <input type="number" id="reorder_level" value="0">

                <label for="barcode">Barcode</label>
                <input type="text" id="barcode">

                <button type="submit">Save Product</button>
                <p id="error-message" class="error"></p>
                <p id="success-message" class="success"></p>
            </form>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/product-form.js"></script>
</body>
</html>
