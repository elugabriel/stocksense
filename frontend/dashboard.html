<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockSense — Dashboard</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="stylesheet" href="css/dashboard.css?v=3">
</head>
<body>
    <nav class="navbar">
        <h2>StockSense</h2>
        <div>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="products.html" class="nav-link">Products</a>
            <a href="stock-actions.html" class="nav-link">Stock Actions</a>
            <a href="locations.html" class="nav-link">Warehouses & Categories</a>
            <a href="movements.html" class="nav-link">Movement History</a>
            <a href="vendors.html" class="nav-link">Vendors</a>
            <a href="purchase-orders.html" class="nav-link">Purchase Orders</a>
            <a href="sales.html" class="nav-link">Sales</a>
            <a href="forecasting.html" class="nav-link">AI Forecasting</a>
            <a href="decision-support.html" class="nav-link">Decision Support</a>
            <a href="comparisons.html" class="nav-link">Comparisons</a>
            <a href="users.html" class="nav-link">Users</a>
            <a href="alerts.html" class="nav-link alert-bell-link">
                <span class="alert-bell">🔔</span>
                <span id="alert-badge-count" class="alert-badge" style="display:none;"></span>
            </a>
            <button id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="dashboard">
        <div class="page-header">
            <h1 id="dashboard-heading">Dashboard</h1>
            <button id="customize-kpis-btn">Customize KPIs</button>
        </div>

        <section id="kpi-panel">
            <h3>Key Metrics</h3>
            <div id="kpi-cards"></div>
        </section>

        <section>
            <h3>By Product</h3>
            <table id="by-product-table">
                <thead>
                    <tr><th>SKU</th><th>Product</th><th>Total Quantity</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section>
            <h3>By Warehouse</h3>
            <table id="by-warehouse-table">
                <thead>
                    <tr><th>Warehouse</th><th>Branch</th><th>Total Quantity</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <div id="kpi-modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal">
            <h3>Customize Your KPIs</h3>
            <div id="kpi-checkboxes"></div>
            <button id="save-kpis-btn">Save</button>
            <button id="cancel-kpis-btn">Cancel</button>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js?v=3"></script>
</body>
</html>
