<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StockSense — Sales</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <link rel="stylesheet" href="css/dashboard.css?v=3">
</head>
<body>
    <nav class="navbar">
        <h2>StockSense</h2>
        <div>
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="products.html" class="nav-link">Products</a>
            <a href="stock-actions.html" class="nav-link">Stock Actions</a>
            <a href="locations.html" class="nav-link">Warehouses & Categories</a>
            <a href="movements.html" class="nav-link">Movement History</a>
            <a href="vendors.html" class="nav-link">Vendors</a>
            <a href="purchase-orders.html" class="nav-link">Purchase Orders</a>
            <a href="sales.html" class="nav-link">Sales</a>
            <a href="forecasting.html" class="nav-link">AI Forecasting</a>
            <a href="users.html" class="nav-link">Users</a>
            <a href="alerts.html" class="nav-link alert-bell-link">
                <span class="alert-bell">🔔</span>
                <span id="alert-badge-count" class="alert-badge" style="display:none;"></span>
            </a>
            <button id="logout-btn">Log Out</button>
        </div>
    </nav>

    <main class="dashboard">
        <div class="page-header">
            <h1>Sales</h1>
            <button id="new-sale-btn">+ Record Sale</button>
        </div>

        <section>
            <h3>Reports</h3>
            <div class="report-links">
                <button id="view-summary-btn">Sales Summary</button>
                <button id="view-revenue-btn">Revenue by Product</button>
                <button id="view-customers-btn">Customer Trends</button>
            </div>
            <div id="report-output"></div>
        </section>

        <table id="sales-table">
            <thead>
                <tr>
                    <th>Sale #</th>
                    <th>Customer</th>
                    <th>Payment</th>
                    <th>Total</th>
                    <th>Sold By</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal" style="width: 600px;">
            <h3>Record Sale</h3>
            <form id="sale-form">
                <label>Sale Number</label>
                <input type="text" id="sale-number" required>
                <label>Warehouse ID</label>
                <input type="number" id="sale-warehouse" required>
                <label>Customer Name</label>
                <input type="text" id="sale-customer-name">
                <label>Customer Phone</label>
                <input type="text" id="sale-customer-phone">
                <label>Payment Method</label>
                <select id="sale-payment">
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                    <option value="bank_transfer">Bank Transfer</option>
                    <option value="mobile_money">Mobile Money</option>
                    <option value="other">Other</option>
                </select>
                <label>Discount</label>
                <input type="number" step="0.01" id="sale-discount" value="0">

                <h4>Scan or Enter Barcode</h4>
                <div class="barcode-row">
                    <input type="text" id="barcode-input" placeholder="Scan barcode and press Enter, or type SKU barcode">
                    <button type="button" id="barcode-lookup-btn">Add Item</button>
                </div>
                <p id="barcode-error" class="error"></p>

                <h4>Items</h4>
                <table id="cart-table">
                    <thead>
                        <tr><th>Product</th><th>Batch</th><th>Qty</th><th>Price</th><th>Line Total</th><th></th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <p id="cart-total"><strong>Subtotal: 0.00</strong></p>

                <button type="submit">Complete Sale</button>
                <p id="sale-error" class="error"></p>
                <p id="sale-success" class="success"></p>
            </form>
        </div>
    </div>

    <div id="receipt-overlay" class="modal-overlay" style="display:none;">
        <div class="modal receipt" id="receipt-content"></div>
    </div>


    <div id="receipt-overlay" class="modal-overlay" style="display:none;">
        <div class="modal receipt" id="receipt-content"></div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/sales.js"></script>
</body>
</html>
