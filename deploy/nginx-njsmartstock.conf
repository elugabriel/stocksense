# /etc/nginx/sites-available/njsmartstock  (symlinked into sites-enabled by setup-server.sh)
# Starts as HTTP only; `certbot --nginx` adds the HTTPS server block and the redirect.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name njsmartstock.co.uk www.njsmartstock.co.uk;

    client_max_body_size 10m;

    # Frontend (static HTML/JS/CSS)
    root /opt/njsmartstock/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }

    # Django static files (admin, DRF) from collectstatic
    location /static/ {
        alias /opt/njsmartstock/staticfiles/;
        expires 7d;
    }

    # Django REST API + admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (live stock updates)
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # AI engine (FastAPI): /ai/foo -> http://127.0.0.1:8001/foo
    location /ai/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
